<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermolog</title>

<style>
:root {
  --bg: #f4f5f7;
  --card: #fff;
  --line: #e4e7ea;
  --text: #1b1f24;
  --muted: #667085;
  --ok: #12734a;      --ok-bg: #e2f4ea;
  --warn: #96620a;    --warn-bg: #fdf2d5;
  --alarm: #b02418;   --alarm-bg: #fce7e5;
  --stale: #475467;   --stale-bg: #eceef1;
  --accent: #14449c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 20px 60px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

.topbar { display: flex; align-items: flex-start; gap: 16px; }
.topbar .grow { flex: 1; }
h1 { font-size: 22px; margin: 0 0 2px; }
h2 { font-size: 15px; margin: 0 0 4px; }
h3 { font-size: 13px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sub { color: var(--muted); font-size: 13px; }
.section-sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0; }
button, select {
  font: inherit;
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
button:hover, select:hover { border-color: #c4c9d0; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: #10367f; }
button.small { padding: 4px 10px; font-size: 12px; }
.spacer { margin-left: auto; }
.updated { color: var(--muted); font-size: 12px; }
#langSelect { padding: 5px 9px; font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.kpi .value { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi.is-alarm .value { color: var(--alarm); }
.kpi.is-warn .value { color: var(--warn); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 20px; }

#alarmBanner { display: none; }
#alarmBanner.show { display: block; }
.alarm-item { border-left: 3px solid var(--alarm); background: var(--alarm-bg); padding: 10px 14px; border-radius: 0 6px 6px 0; margin-bottom: 8px; }
.alarm-item:last-child { margin-bottom: 0; }
.alarm-item.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.alarm-item.stale { border-left-color: var(--stale); background: var(--stale-bg); }
.alarm-item .act { margin-top: 8px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
table.wide { min-width: 800px; }
th, td { padding: 10px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
tbody tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: #fafbfc; }
td.temp { font-size: 17px; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.unit-name { font-weight: 600; }
.note { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.legal { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; font-style: italic; white-space: normal; }

.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.alarm { background: var(--alarm-bg); color: var(--alarm); }
.badge.stale { background: var(--stale-bg); color: var(--stale); }
.badge.due { background: var(--warn-bg); color: var(--warn); }

/* Store layout: status at a glance, the way a floor plan is read */
.plan {
  position: relative;
  width: 100%;
  height: 400px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background-color: #fbfcfd;
  background-image:
    linear-gradient(rgba(102,112,133,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(102,112,133,.09) 1px, transparent 1px);
  background-size: 44px 44px;
  overflow: hidden;
  touch-action: none;
}
.plan.editing { background-color: #f7f9fc; }

.tile {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 8px;
  border: 2px solid;
  border-radius: 6px;
  overflow: hidden;
  text-align: center;
  cursor: pointer;
}
.plan.editing .tile { cursor: grab; }
.plan.editing .tile.dragging { cursor: grabbing; opacity: .85; }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.tile .tname { font-size: 12px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.tile .ttemp { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .tmark {
  position: absolute;
  top: 3px;
  inset-inline-start: 6px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
}

.tile.ok    { background: var(--ok-bg);    border-color: var(--ok);    color: var(--ok); }
.tile.warn  { background: var(--warn-bg);  border-color: var(--warn);  color: var(--warn); }
.tile.alarm { background: var(--alarm-bg); border-color: var(--alarm); color: var(--alarm); }
.tile.stale { background: var(--stale-bg); border-color: var(--stale); color: var(--stale); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i {
  width: 13px; height: 13px; border-radius: 3px;
  border: 2px solid; font-style: normal;
}
.legend i.ok    { background: var(--ok-bg);    border-color: var(--ok); }
.legend i.warn  { background: var(--warn-bg);  border-color: var(--warn); }
.legend i.alarm { background: var(--alarm-bg); border-color: var(--alarm); }
.legend i.stale { background: var(--stale-bg); border-color: var(--stale); }

.modal { display: none; position: fixed; inset: 0; background: rgba(15,18,22,.5); padding: 20px; overflow-y: auto; }
.modal.show { display: block; }
.modal-content { background: var(--card); border-radius: 10px; padding: 22px; max-width: 660px; margin: 40px auto; }
.modal-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.modal-head h2 { flex: 1; font-size: 18px; }
.close { border: none; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0 4px; }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--bg); border-radius: 6px; padding: 10px; }
.stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; }
.stat .value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

.chart { width: 100%; height: 150px; display: block; }
.caption { color: var(--muted); font-size: 12px; margin: 6px 0 18px; }

label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
input[type=text], textarea {
  font: inherit; width: 100%; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
}
textarea { min-height: 80px; resize: vertical; }

.empty { color: var(--muted); padding: 18px 0; text-align: center; }
.notice { border-radius: 6px; padding: 11px 14px; font-size: 13px; margin-bottom: 20px; }
.notice.demo { background: #fff8e1; border: 1px solid #f2e0a4; color: #6f5300; }
.notice.legal-basis { background: #eef3fb; border: 1px solid #cfdcf2; color: #1c3a70; }
.notice.legal-basis ul { margin: 8px 0 0; padding-inline-start: 20px; }
.notice.legal-basis li { margin-bottom: 3px; }

#report { display: none; }
#report.show { display: block; }
.report-head { border-bottom: 2px solid var(--text); padding-bottom: 10px; margin-bottom: 16px; }
.report-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 20px; font-size: 13px; margin-bottom: 20px; }
.report-meta div span { color: var(--muted); }
.sign { margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.sign div { border-top: 1px solid var(--text); padding-top: 6px; font-size: 12px; color: var(--muted); }

@media print {
  body { padding: 0; background: #fff; }
  .toolbar, .kpis, #alarmBanner, .notice.demo, .no-print { display: none !important; }
  .card { border: none; padding: 0; margin-bottom: 24px; page-break-inside: avoid; }
  #report { display: block !important; }
  table.wide { min-width: 0; }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="grow">
    <h1>Thermolog</h1>
    <div class="sub" id="storeLine"></div>
  </div>
  <select id="langSelect" class="no-print" onchange="setLang(this.value)" aria-label="Language">
    <option value="el">Ελληνικά</option>
    <option value="en">English</option>
  </select>
</div>

<div id="demoNote" class="notice demo" hidden></div>

<div class="toolbar no-print">
  <button class="primary" onclick="refresh()" id="btnRefresh"></button>
  <select id="periodSelect" onchange="render()">
    <option value="1"></option>
    <option value="7" selected></option>
    <option value="30"></option>
  </select>
  <button onclick="toggleReport()" id="btnReport"></button>
  <button onclick="exportCsv()" id="btnCsv"></button>
  <span class="spacer updated" id="updatedAt"></span>
</div>

<div class="kpis" id="kpis"></div>

<div class="card" id="alarmBanner">
  <h2 id="hAlarms"></h2>
  <div class="section-sub" id="sAlarms"></div>
  <div id="alarmList"></div>
</div>

<div class="card">
  <h2 id="hPlan"></h2>
  <div class="section-sub" id="sPlan"></div>
  <div class="plan" id="plan"></div>
  <div class="legend" id="planLegend"></div>
  <div class="toolbar no-print" style="margin-bottom:0">
    <button onclick="toggleArrange()" id="btnArrange"></button>
    <span class="updated" id="arrangeHint"></span>
  </div>
</div>

<div class="card">
  <h2 id="hUnits"></h2>
  <div class="section-sub" id="sUnits"></div>
  <div class="table-wrap"><table class="wide">
    <thead><tr id="thUnits"></tr></thead>
    <tbody id="unitRows"></tbody>
  </table></div>
  <div class="toolbar no-print" style="margin-bottom:0">
    <button onclick="openUnitForm()" id="btnAddUnit"></button>
  </div>
</div>

<div class="card">
  <h2 id="hCategories"></h2>
  <div class="section-sub" id="sCategories"></div>
  <div class="table-wrap"><table class="wide">
    <thead><tr id="thCategoriesRow"></tr></thead>
    <tbody id="categoryRows"></tbody>
  </table></div>
  <div class="toolbar no-print" style="margin-bottom:0">
    <button onclick="openCategoryForm()" id="btnAddCategory"></button>
  </div>
</div>

<div class="card">
  <h2 id="hDeviations"></h2>
  <div class="section-sub" id="sDeviations"></div>
  <div class="table-wrap"><table class="wide">
    <thead><tr id="thDeviations"></tr></thead>
    <tbody id="deviationRows"></tbody>
  </table></div>
</div>

<div class="card">
  <h2 id="hSensors"></h2>
  <div class="section-sub" id="sSensors"></div>
  <div class="table-wrap"><table class="wide">
    <thead><tr id="thSensors"></tr></thead>
    <tbody id="sensorRows"></tbody>
  </table></div>
</div>

<div class="card">
  <h2 id="hNotify"></h2>
  <div class="section-sub" id="sNotify"></div>
  <div class="notice demo no-print" id="notifyWarning"></div>

  <h3 id="hRecipients"></h3>
  <div class="table-wrap"><table class="wide">
    <thead><tr id="thRecipients"></tr></thead>
    <tbody id="recipientRows"></tbody>
  </table></div>
  <div class="toolbar no-print" style="margin-bottom:0">
    <button onclick="openRecipientForm()" id="btnAddRecipient"></button>
  </div>

  <h3 id="hDispatchLog"></h3>
  <div class="table-wrap"><table class="wide">
    <thead><tr id="thDispatch"></tr></thead>
    <tbody id="dispatchRows"></tbody>
  </table></div>
</div>

<!-- Compliance report, laid out for printing to PDF -->
<div class="card" id="report"></div>

<div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>

     GET  ?type=readings -> [{ unit_id, ts (ISO 8601), temp_c }]
     POST { action: "corrective_action", unit_id, deviation_start, text, person } */

/* Site shown in the header and on the printed report. */
const STORE_NAME = { el: 'Υπεραγορά – Κατάστημα επίδειξης', en: 'Supermarket – Demo store' };

/* Margin to the critical limit at which a unit is flagged as a warning (°C). */

/* How long a unit may stay outside its limits before the deviation is escalated
   to an alarm (minutes). Short excursions during deliveries or defrost cycles
   should not raise an alarm. */
const ALARM_GRACE_MIN = 30;

/* No reading for this long means the sensor has lost contact (minutes). */
const STALE_AFTER_MIN = 60;

/* Automatic refresh (seconds). 0 disables it. */

   recipients are notified at the level they are registered for. */

let lang = (() => {
  try { return localStorage.getItem('thermolog.lang') || 'el'; } catch { return 'el'; }
})();

/* Looks up a translation and substitutes {placeholders}. */
function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.el[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}

/* Resolves a field that may be a plain string or a { el, en } object. */
function L(value) {
  if (value && typeof value === 'object') return value[lang] ?? value.el ?? value.en ?? '';
  return value ?? '';
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem('thermolog.lang', next); } catch { /* ignore */ }
  document.documentElement.lang = next;
  render();
}

/* ============================================================

   ============================================================ */
async function loadData() {
  if (!API_URL) {
    document.getElementById('demoNote').hidden = false;
    const demo = buildDemoData();
    readings = demo.readings;
    /* Units and categories edited in demo mode persist in the browser, so
       adding a freezer behaves the way it will against a real backend. */
    categories = readStore('thermolog.categories.v1', demo.categories);
    units = readStore('thermolog.units.v1', demo.units);
  } else {
    const [u, c, r] = await Promise.all([
      fetch(API_URL + '?type=units', { cache: 'no-store' }).then(res => res.json()),
      fetch(API_URL + '?type=categories', { cache: 'no-store' }).then(res => res.json()),
      fetch(API_URL + '?type=readings', { cache: 'no-store' }).then(res => res.json())
    ]);
    units = u;
    categories = c;
    readings = r;
  }

  units = units.map(resolveLimits);
}

function saveUnits() {
  if (!API_URL) writeStore('thermolog.units.v1', units.map(stripDerived));
  else postJson({ action: 'save_units', units: units.map(stripDerived) });
}

function saveCategories() {
  if (!API_URL) writeStore('thermolog.categories.v1', categories);
  else postJson({ action: 'save_categories', categories: categories });
}

function postJson(payload) {
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
    .catch(err => console.error('Save failed:', err));
}

/* Derived fields are recomputed on every load; only the stored shape is saved. */
function stripDerived(unit) {
  const { min_c, max_c, legal_ref, limitSource, bindingMin, bindingMax, limitConflict, ...rest } = unit;
  return rest;
}

/* ============================================================
   LIMIT DERIVATION
   ============================================================
   A unit inherits its critical limits from the product categories it holds.
   Where several categories share a cabinet the strictest bound of each side
   wins: chilled poultry beside fresh meat is a 4 °C unit, not a 7 °C one.
   Getting this wrong is worse than not measuring, because the record would
   then certify a breach as compliant. */
function resolveLimits(unit) {
  const cats = (unit.category_ids || [])
    .map(id => categories.find(c => c.id === id))
    .filter(Boolean);

  const resolved = { ...unit, limitSource: 'category', limitConflict: false };

  if (unit.override && unit.override.reason) {
    resolved.min_c = Number(unit.override.min_c);
    resolved.max_c = Number(unit.override.max_c);
    resolved.limitSource = 'override';
  } else if (cats.length) {
    /* Strictest lower bound is the highest minimum; strictest upper bound the
       lowest maximum. */
    const lower = cats.reduce((a, c) => (c.min_c > a.min_c ? c : a));
    const upper = cats.reduce((a, c) => (c.max_c < a.max_c ? c : a));
    resolved.min_c = lower.min_c;
    resolved.max_c = upper.max_c;
    resolved.bindingMin = lower;
    resolved.bindingMax = upper;
    resolved.limitConflict = lower.min_c > upper.max_c;
  } else {
    resolved.min_c = 0;
    resolved.max_c = 0;
    resolved.limitConflict = true;
  }

  resolved.tolerance_c = Number(unit.tolerance_c || 0);
  resolved.legal_ref = legalRefFor(resolved, cats);
  return resolved;
}

/* The citation shown against a unit: whichever categories actually set its
   bounds, plus the justification when a unit departs from them. */
function legalRefFor(unit, cats) {
  if (unit.limitSource === 'override') {
    const reason = unit.override.reason;
    const pick = lng => (reason && typeof reason === 'object' ? reason[lng] : reason) || '';
    return { el: 'Απόκλιση: ' + pick('el'), en: 'Override: ' + pick('en') };
  }
  const binding = [unit.bindingMin, unit.bindingMax].filter(Boolean);
  if (!binding.length) return '';

  const cite = (c, lng) => {
    const ref = c.legal_ref;
    return (ref && typeof ref === 'object' ? ref[lng] : ref) || '';
  };
  const unique = lng => binding.map(c => cite(c, lng))
    .filter((v, i, a) => v && a.indexOf(v) === i)
    .join(' · ');

  return { el: unique('el'), en: unique('en') };
}

function categoryById(id) { return categories.find(c => c.id === id); }

function unitsUsing(categoryId) {
  return units.filter(u => (u.category_ids || []).includes(categoryId));

/* ============================================================
   CALCULATIONS
   ============================================================ */
function periodDays() {
  return Number(document.getElementById('periodSelect').value);
}

function readingsFor(unitId) {
  return readings
    .filter(r => r.unit_id === unitId)
    .map(r => ({ unit_id: r.unit_id, t: new Date(r.ts).getTime(), temp_c: Number(r.temp_c) }))
    .sort((a, b) => a.t - b.t);
}

function outOfRange(unit, temp) {
  return temp < unit.min_c || temp > unit.max_c;
}

/* `tolerance_c` covers the brief upward fluctuations the law permits for
   quick-frozen foods; beyond it a deviation is an alarm regardless of duration. */
function beyondTolerance(unit, temp) {
  const tol = unit.tolerance_c || 0;
  return temp < unit.min_c - tol || temp > unit.max_c + tol;
}

/* Groups consecutive out-of-limit readings into discrete deviation events —
   the form an inspection asks for: when it started, how long it lasted, how far
   it went, and what was done about it. */
function deviationEvents(unit, series, fromTs) {
  const events = [];
  let current = null;

  series.filter(r => r.t >= fromTs).forEach(r => {
    if (outOfRange(unit, r.temp_c)) {
      if (!current) current = { unit, start: r.t, end: r.t, extreme: r.temp_c, beyond: false };
      current.end = r.t;
      current.beyond = current.beyond || beyondTolerance(unit, r.temp_c);
      const worseHigh = r.temp_c > unit.max_c && r.temp_c > current.extreme;
      const worseLow = r.temp_c < unit.min_c && r.temp_c < current.extreme;
      if (worseHigh || worseLow) current.extreme = r.temp_c;
    } else if (current) {
      events.push(current);
      current = null;
    }
  });

  if (current) { current.ongoing = true; events.push(current); }

  return events.map(e => ({
    ...e,
    id: `${unit.id}:${e.start}`,
    minutes: Math.max(1, Math.round(((e.ongoing ? Date.now() : e.end) - e.start) / 60000))
  }));
}

/* Overall status of a unit: ok | warn | alarm | stale. */
function evaluate(unit) {
  const series = readingsFor(unit.id);
  const last = series[series.length - 1];

  if (!last) return { unit, series, status: 'stale', note: t('awaitingSensor') };

  const ageMin = Math.round((Date.now() - last.t) / 60000);
  if (ageMin > STALE_AFTER_MIN) {
    return { unit, series, last, status: 'stale', note: t('noContactFor', { dur: formatDuration(ageMin) }) };
  }

  const open = deviationEvents(unit, series, Date.now() - 48 * 3600000).find(e => e.ongoing);
  if (open) {
    const escalated = open.beyond || open.minutes >= ALARM_GRACE_MIN;
    return {
      unit, series, last, deviation: open,
      status: escalated ? 'alarm' : 'warn',
      note: open.beyond
        ? t('beyondTol', { temp: open.extreme.toFixed(1), dur: formatDuration(open.minutes) })
        : t('outOfLimits', { dur: formatDuration(open.minutes) }) +
          (escalated ? '' : t('alarmAfter', { min: ALARM_GRACE_MIN }))
    };
  }

  const margin = Math.min(last.temp_c - unit.min_c, unit.max_c - last.temp_c);
  if (margin <= WARN_MARGIN_C) {
    return { unit, series, last, status: 'warn', note: t('nearLimit', { margin: margin.toFixed(1) }) };
  }

  return { unit, series, last, status: 'ok', note: '' };
}

function statsOver(unit, series, days) {
  const from = Date.now() - days * 24 * 3600000;
  const window = series.filter(r => r.t >= from);
  if (!window.length) return null;

  const temps = window.map(r => r.temp_c);
  let outMs = 0;
  for (let i = 1; i < window.length; i++) {
    if (outOfRange(unit, window[i].temp_c)) outMs += window[i].t - window[i - 1].t;
  }

  return {
    count: window.length,
    min: Math.min(...temps),
    max: Math.max(...temps),
    avg: temps.reduce((a, b) => a + b, 0) / temps.length,
    outMin: Math.round(outMs / 60000)
  };
}

/* Inline SVG curve with the permitted range drawn as a band behind it. */
function sparkline(unit, series, width = 150, height = 34) {
  const from = Date.now() - 24 * 3600000;
  const pts = series.filter(r => r.t >= from);
  if (pts.length < 2) return '<span class="note">–</span>';

  const temps = pts.map(p => p.temp_c);
  const lo = Math.min(unit.min_c, ...temps);
  const hi = Math.max(unit.max_c, ...temps);
  const span = (hi - lo) || 1;
  const t0 = pts[0].t;
  const tSpan = (pts[pts.length - 1].t - t0) || 1;

  const x = p => ((p.t - t0) / tSpan) * width;
  const y = v => height - ((v - lo) / span) * height;
  const bandTop = y(unit.max_c);

  return `
    <svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" aria-hidden="true">
      <rect x="0" y="${bandTop.toFixed(1)}" width="${width}"
            height="${Math.max(0, y(unit.min_c) - bandTop).toFixed(1)}" fill="#e2f4ea"></rect>
      <polyline points="${pts.map(p => `${x(p).toFixed(1)},${y(p.temp_c).toFixed(1)}`).join(' ')}"
                fill="none" stroke="#14449c" stroke-width="1.5"
                stroke-linejoin="round" stroke-linecap="round"></polyline>
    </svg>`;
}

/* ============================================================
   STORE LAYOUT
   ============================================================
   The overview staff actually use: where each cabinet stands, and one colour
   saying whether it is fine. Everything else is a click away. */

/* Footprints as a share of the plan area. The shape says what kind of
   installation it is — a display cabinet runs long, a cold room is a box. */
const PLAN_SHAPES = {
  cabinet: { w: 22, h: 14 },
  chiller: { w: 15, h: 20 },
  room:    { w: 20, h: 30 }
};

/* Status is never carried by colour alone: a mark repeats it for anyone who
   cannot separate red from green. */
const PLAN_MARKS = { ok: '✓', warn: '!', alarm: '✕', stale: '?' };

let arranging = false;

function planFor(unit, index) {
  const shape = PLAN_SHAPES[unit.plan_shape] || PLAN_SHAPES.chiller;
  const placed = unit.plan && Number.isFinite(unit.plan.x);
  if (placed) return { x: unit.plan.x, y: unit.plan.y, ...shape };

  /* Units that have never been arranged flow into rows, so a freshly added
     freezer appears somewhere sensible instead of on top of another. */
  const perRow = 4;
  return {
    x: 4 + (index % perRow) * 24,
    y: 6 + Math.floor(index / perRow) * 32,
    ...shape
  };
}

function renderPlan(states) {
  const plan = document.getElementById('plan');
  plan.classList.toggle('editing', arranging);

  plan.innerHTML = states.map((s, i) => {
    const pos = planFor(s.unit, i);
    return `
      <div class="tile ${s.status}" data-unit="${s.unit.id}" tabindex="0" role="button"
           aria-label="${escapeHtml(L(s.unit.name))}: ${statusLabel(s.status)}"
           style="left:${pos.x}%; top:${pos.y}%; width:${pos.w}%; height:${pos.h}%">
        <span class="tmark" aria-hidden="true">${PLAN_MARKS[s.status]}</span>
        <span class="tname">${escapeHtml(L(s.unit.name))}</span>
        ${s.last ? `<span class="ttemp">${s.last.temp_c.toFixed(1)}°</span>` : ''}
      </div>`;
  }).join('');

  document.getElementById('planLegend').innerHTML = ['ok', 'warn', 'alarm', 'stale']
    .map(k => `<span><i class="${k}"></i>${statusLabel(k)}</span>`).join('');

  document.getElementById('btnArrange').textContent = arranging ? t('arrangeDone') : t('arrange');
  document.getElementById('arrangeHint').textContent = arranging ? t('arrangeHint') : '';
}

function toggleArrange() {
  arranging = !arranging;
  if (!arranging) saveUnits();
  render();
}

/* One delegated pointer handler for the whole plan: press a tile to open it,
   or drag it into place while arranging. */
(function enablePlanInteraction() {
  const plan = document.getElementById('plan');
  let drag = null;

  plan.addEventListener('pointerdown', e => {
    const tile = e.target.closest('.tile');
    if (!tile) return;

    if (!arranging) { openUnit(tile.dataset.unit); return; }

    const area = plan.getBoundingClientRect();
    const box = tile.getBoundingClientRect();
    drag = {
      tile,
      unitId: tile.dataset.unit,
      /* Where inside the tile the pointer grabbed it, so it does not jump. */
      offsetX: ((e.clientX - box.left) / area.width) * 100,
      offsetY: ((e.clientY - box.top) / area.height) * 100,
      w: (box.width / area.width) * 100,
      h: (box.height / area.height) * 100
    };
    tile.classList.add('dragging');
    tile.setPointerCapture(e.pointerId);
  });

  plan.addEventListener('pointermove', e => {
    if (!drag) return;
    const area = plan.getBoundingClientRect();

    const x = clamp(((e.clientX - area.left) / area.width) * 100 - drag.offsetX, 0, 100 - drag.w);
    const y = clamp(((e.clientY - area.top) / area.height) * 100 - drag.offsetY, 0, 100 - drag.h);

    drag.tile.style.left = x + '%';
    drag.tile.style.top = y + '%';
    drag.x = x;
    drag.y = y;
  });

  plan.addEventListener('pointerup', () => {
    if (!drag) return;
    if (Number.isFinite(drag.x)) {
      const unit = units.find(u => u.id === drag.unitId);
      if (unit) unit.plan = { x: round1(drag.x), y: round1(drag.y) };
    }
    drag.tile.classList.remove('dragging');
    drag = null;
  });

  /* Keyboard equivalent, so the plan is not mouse-only. */
  plan.addEventListener('keydown', e => {
    const tile = e.target.closest('.tile');
    if (!tile) return;

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (!arranging) openUnit(tile.dataset.unit);
      return;
    }

    if (!arranging) return;
    const step = e.shiftKey ? 5 : 1;
    const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!move) return;

    e.preventDefault();
    const unit = units.find(u => u.id === tile.dataset.unit);
    if (!unit) return;

    const i = units.indexOf(unit);
    const pos = planFor(unit, i);
    unit.plan = {
      x: round1(clamp(pos.x + move[0], 0, 100 - pos.w)),
      y: round1(clamp(pos.y + move[1], 0, 100 - pos.h))
    };
    render();
    document.querySelector(`.tile[data-unit="${unit.id}"]`).focus();
  });
})();

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function round1(v) { return Math.round(v * 10) / 10; }

/* Which category actually sets a unit's bounds, or why it has none. */
function limitNote(unit) {
  if (unit.limitConflict) return `<span class="badge alarm">${t('limitConflict')}</span>`;
  if (unit.limitSource === 'override') return `<span class="badge warn">${t('overrideBadge')}</span>`;

  const binding = unit.bindingMax || unit.bindingMin;
  const shared = unit.bindingMin && unit.bindingMax && unit.bindingMin.id === unit.bindingMax.id;
  if (!binding || ((unit.category_ids || []).length < 2 && shared)) return '';

  const names = [unit.bindingMin, unit.bindingMax]
    .filter(Boolean)
    .map(c => L(c.name))
    .filter((n, i, a) => a.indexOf(n) === i)
    .join(' / ');
  return `<span class="note">${t('binding', { name: escapeHtml(names) })}</span>`;
}

function saveCategory(id) {
  const name = document.getElementById('cName').value.trim();
  const min_c = Number(document.getElementById('cMin').value);
  const max_c = Number(document.getElementById('cMax').value);

  if (!name || !Number.isFinite(min_c) || !Number.isFinite(max_c)) {
    alert(t('validationCategory'));
    return;
  }

  const data = { name, min_c, max_c, legal_ref: document.getElementById('cRef').value.trim() };
  const existing = categoryById(id);
  if (existing) Object.assign(existing, data);
  else categories.push({ id: 'c' + Date.now().toString(36), ...data });

  saveCategories();
  units = units.map(resolveLimits);   /* limits are inherited, so re-derive */
  closeModal();
  render();
}

function deleteCategory(id) {
  const c = categoryById(id);
  if (!c) return;

  const inUse = unitsUsing(id).length;
  if (inUse) { alert(t('categoryInUse', { n: inUse })); return; }
  if (!confirm(t('confirmDeleteCategory', { name: L(c.name) }))) return;

  categories = categories.filter(x => x.id !== id);
  saveCategories();
  closeModal();
  render();
}

   strictest-wins rule is visible before it is saved rather than after. */

  if (!draft) return;

  document.getElementById('overrideFields').hidden = !draft.override;

  const resolved = resolveLimits(draft);
  const el = document.getElementById('limitPreview');

  if (resolved.limitConflict) {
    el.innerHTML = `<span class="badge alarm">${t('limitConflict')}</span>`;
    return;
  }

  el.innerHTML = `<strong style="color:var(--text)">${fmtRange(resolved)}</strong>
    ${limitNote(resolved)}

function saveUnit(id) {
  const draft = readUnitForm();

  if (!draft.name || (!draft.category_ids.length && !draft.override)) {
    alert(t('validationUnit'));
    return;
  }
  if (draft.override && !draft.override.reason) {
    alert(t('validationOverride'));
    return;

  if (existing) Object.assign(existing, draft);

  units = units.filter(x => x.id !== id);
  saveUnits();
  closeModal();
  render();
}

/* ============================================================
   ALARM DELIVERY
   ============================================================
   The browser can only dispatch while someone has the page open, which is not
   when a compressor fails. This engine decides *what* should be sent and keeps
   the audit trail; in production the same rules belong on the server, and the
   page then only displays the log it reads back. See backend/Code.gs. */

/* Identifies an alarm condition across refreshes so it is not re-sent as new.
   Deviations are keyed by their start; a silent sensor by its last reading. */
function alarmKey(state) {
  if (state.status === 'alarm' && state.deviation) return state.deviation.id;
  if (state.status === 'stale') return `${state.unit.id}:stale:${state.last ? state.last.t : 0}`;
  return null;
}

function alarmStart(state) {
  if (state.status === 'alarm' && state.deviation) return state.deviation.start;
  return state.last ? state.last.t + STALE_AFTER_MIN * 60000 : Date.now();
}

/* Escalation levels that are due for an alarm, taking into account what has
   already gone out and whether a corrective action has closed it. */
function pendingDispatches(state) {
  const key = alarmKey(state);
  if (!key) return [];

  /* A recorded corrective action ends the escalation. */
  if (state.deviation && actions[state.deviation.id]) return [];

  const elapsed = (Date.now() - alarmStart(state)) / 60000;
  const due = [];

  NOTIFY_LADDER_MIN.forEach((afterMin, i) => {
    const level = i + 1;
    if (elapsed < afterMin) return;

    const sentAtLevel = notifyLog.filter(n => n.key === key && n.level === level);
    if (sentAtLevel.length >= NOTIFY_MAX_REPEATS * Math.max(1, recipientsAt(level).length)) return;

    const lastAt = sentAtLevel.reduce((max, n) => Math.max(max, n.at), 0);
    if (lastAt && (Date.now() - lastAt) / 60000 < NOTIFY_REPEAT_MIN) return;

    due.push({ key, level, state });
  });

  return due;
}

function recipientsAt(level) {
  return recipients.filter(r => Number(r.level) === level);
}

/* Sends everything that is due and records each attempt. Runs after every
   refresh; the in-flight guard keeps a slow endpoint from being hit twice. */
async function processNotifications(states) {
  if (notifyInFlight) return;

  const due = states.flatMap(pendingDispatches);
  if (!due.length) return;

  notifyInFlight = true;
  try {
    for (const item of due) {
      for (const r of recipientsAt(item.level)) {
        const entry = {
          key: item.key,
          unit_id: item.state.unit.id,
          unit: item.state.unit.name,
          level: item.level,
          cause: item.state.status === 'stale' ? 'stale' : 'alarm',
          detail: item.state.note,
          temp_c: item.state.last ? item.state.last.temp_c : null,
          recipient: r.name,
          channel: r.channel,
          address: r.address,
          at: Date.now(),
          status: 'simulated'
        };

        if (API_URL) {
          try {
            const res = await fetch(API_URL, {
              method: 'POST',
              body: JSON.stringify({
                action: 'notify',
                unit_id: entry.unit_id,
                alarm_key: entry.key,
                level: entry.level,
                cause: entry.cause,
                channel: entry.channel,
                address: entry.address,
                subject: `${L(entry.unit)} – ${t(entry.cause === 'stale' ? 'causeStale' : 'causeAlarm')}`,
                body: `${L(entry.unit)}: ${entry.detail}` +
                      (entry.temp_c !== null ? ` (${entry.temp_c.toFixed(1)} °C)` : '')
              })
            });
            entry.status = res.ok ? 'sent' : 'failed';
          } catch {
            entry.status = 'failed';
          }
        }

        notifyLog.push(entry);
      }
    }
    saveNotifyLog();
    renderNotifications();
  } finally {
    notifyInFlight = false;
  }
}

/* ============================================================
   CORRECTIVE ACTIONS
   ============================================================ */
function findDeviation(id) {
  const unitId = id.split(':')[0];
  const unit = units.find(u => u.id === unitId);
  if (!unit) return null;
  return deviationEvents(unit, readingsFor(unitId), 0).find(e => e.id === id) || null;
}

function openActionForm(id) {
  const e = findDeviation(id);
  if (!e) return;
  const existing = actions[id] || { text: '', person: '' };

  showModal(`
    <div class="modal-head">
      <h2>${t('actionTitle')}</h2>
      <button class="close" onclick="closeModal()" aria-label="${t('close')}">&times;</button>
    </div>

    <div class="caption">${t('actionContext', {
      unit: escapeHtml(L(e.unit.name)),
      temp: e.extreme.toFixed(1),
      limits: t('limitsShort', { range: fmtRange(e.unit) }),

      dur: formatDuration(e.minutes)
    })}</div>

    <label for="actionText">${t('actionLabel')}</label>
    <textarea id="actionText" placeholder="${t('actionPlaceholder')}">${escapeHtml(existing.text)}</textarea>

    <label for="actionPerson">${t('personLabel')}</label>
    <input type="text" id="actionPerson" value="${escapeHtml(existing.person)}" placeholder="${t('personPlaceholder')}">

    <div class="toolbar" style="margin-bottom:0">

      <button onclick="closeModal()">${t('cancel')}</button>
    </div>`);

  document.getElementById('actionText').focus();
}

async function saveAction(id) {
  const text = document.getElementById('actionText').value.trim();
  const person = document.getElementById('actionPerson').value.trim();
  if (!text || !person) { alert(t('validation')); return; }

  const e = findDeviation(id);
  actions[id] = { text, person, at: Date.now() };
  saveActions();

  if (API_URL && e) {
    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'corrective_action',
          unit_id: e.unit.id,
          deviation_start: new Date(e.start).toISOString(),
          text, person
        })
      });
    } catch (err) {
      console.error(t('postFailed'), err);
    }
  }

  closeModal();
  render();
}

async function exportCsv() {
  const days = periodDays();
  const header = ['unit', 'department', 'min_limit_c', 'max_limit_c',
                  'min_c', 'avg_c', 'max_c', 'readings', 'minutes_out_of_limits',
                  'status', 'sensor', 'serial', 'standard'];

  const rows = units.map(unit => {
    const s = evaluate(unit);
    const st = statsOver(unit, s.series, days);
    const sn = unit.sensor || {};
    return [
      L(unit.name), L(unit.department), unit.min_c, unit.max_c,
      st ? st.min.toFixed(1) : '', st ? st.avg.toFixed(1) : '', st ? st.max.toFixed(1) : '',
      st ? st.count : 0, st ? st.outMin : 0,
      statusLabel(s.status), sn.model || '', sn.serial || '', sn.standard || ''
    ];
  });

  const csv = [header, ...rows]
    .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';'))
    .join('\r\n');

  const filename = `thermolog-${new Date().toISOString().slice(0, 10)}.csv`;
  const content = '\ufeff' + csv;   /* BOM, so Greek opens correctly in Excel */

  /* Published as a hosted page the frame cannot start a download itself; the
     host mediates the save and the viewer confirms it. Opened as a local file
     there is no host, so fall back to an object URL. */
  const downloads = window.claude ? await window.claude.use('downloads') : null;
  if (downloads) {
    try {
      await downloads.save({ filename, data: content });
    } catch (err) {
      if (err && err.code !== 'declined') console.error('Save failed:', err);
    }
    return;
  }

  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

/* ============================================================
   HELPERS
   ============================================================ */
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function statusLabel(s) {
  return { ok: t('stOk'), warn: t('stWarn'), alarm: t('stAlarm'), stale: t('stStale') }[s] || s;
}

function severity(s) { return { ok: 0, stale: 1, warn: 2, alarm: 3 }[s] || 0; }

function fmtRange(unit) {
  return t('range', { min: unit.min_c, max: unit.max_c }) +
         (unit.tolerance_c ? t('tolerance', { tol: unit.tolerance_c }) : '');
}

/* Greek distinguishes singular from plural for every time unit, so durations
   are composed from individually pluralised parts rather than one template. */
function plural(n, key) {
  return t(n === 1 ? key + '1' : key, { n });
}

function formatDuration(min) {
  if (min < 60) return plural(min, 'unitMin');

  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m ? `${plural(h, 'unitHour')} ${plural(m, 'unitMin')}` : plural(h, 'unitHour');

  const d = Math.floor(h / 24), rh = h % 24;
  return rh ? `${plural(d, 'unitDay')} ${plural(rh, 'unitHour')}` : plural(d, 'unitDay');
}

function locale() { return I18N[lang].locale; }

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
}

function formatDate(v) {
  return new Date(v).toLocaleDateString(locale(), { year: 'numeric', month: '2-digit', day: '2-digit' });
}

function formatDateTime(v) {
  return new Date(v).toLocaleString(locale(), { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============================================================
   DEMO DATA
   ============================================================
   Seven units typical of a supermarket. Critical limits follow Reg. (EC)
   853/2004 Annex III for foods of animal origin and Directive 89/108/EEC for
   quick-frozen foods; the −18 °C display cabinet carries the 3 °C tolerance the
   directive permits at retail. */
let demoCache = null;

function buildDemoData() {
  /* Generated once per session. Regenerating on every refresh would shift each
     deviation's start timestamp, and alarms are keyed by that start — an
     unstable key would make every refresh look like a brand-new alarm and
     re-notify everyone. Real readings have fixed timestamps; the demo must
     behave the same way. */
  if (demoCache) return demoCache;

  /* Critical limits live here, once, with the provision they come from. Units
     inherit them; nobody types a temperature limit into a cabinet by hand. */
  const demoCategories = [
    { id: 'cat_frozen', name: { el: 'Κατεψυγμένα', en: 'Quick-frozen foods' },
      min_c: -30, max_c: -18,
      legal_ref: { el: 'Οδηγία 89/108/ΕΟΚ – −18 °C', en: 'Directive 89/108/EEC – −18 °C' } },

    { id: 'cat_meat', name: { el: 'Νωπό κρέας', en: 'Fresh meat' },
      min_c: 0, max_c: 7,
      legal_ref: { el: 'Καν. (ΕΚ) 853/2004, Παρ. III', en: 'Reg. (EC) 853/2004, Annex III' } },

    { id: 'cat_poultry', name: { el: 'Πουλερικά', en: 'Poultry' },
      min_c: 0, max_c: 4,
      legal_ref: { el: 'Καν. (ΕΚ) 853/2004, Παρ. III', en: 'Reg. (EC) 853/2004, Annex III' } },

    { id: 'cat_minced', name: { el: 'Κιμάς', en: 'Minced meat' },
      min_c: 0, max_c: 2,
      legal_ref: { el: 'Καν. (ΕΚ) 853/2004, Παρ. III', en: 'Reg. (EC) 853/2004, Annex III' } },

    { id: 'cat_offal', name: { el: 'Εντόσθια', en: 'Offal' },
      min_c: 0, max_c: 3,
      legal_ref: { el: 'Καν. (ΕΚ) 853/2004, Παρ. III', en: 'Reg. (EC) 853/2004, Annex III' } },

    { id: 'cat_fish', name: { el: 'Αλιεύματα', en: 'Fishery products' },
      min_c: -1, max_c: 2,
      legal_ref: { el: 'Καν. (ΕΚ) 853/2004, Παρ. III – θερμοκρασία τηκόμενου πάγου',
                   en: 'Reg. (EC) 853/2004, Annex III – temperature of melting ice' } },

    { id: 'cat_dairy', name: { el: 'Γαλακτοκομικά', en: 'Dairy' },
      min_c: 0, max_c: 6,
      legal_ref: { el: 'Καν. (ΕΚ) 852/2004 – οδηγίες παρασκευαστή',
                   en: 'Reg. (EC) 852/2004 – manufacturer instructions' } }
  ];

  const demoUnits = [
    { id: 'fr1', device_id: '24E124136D000101',
      plan_shape: 'cabinet', plan: { x: 31, y: 10 },
      name: { el: 'Βιτρίνα κατεψυγμένων 1', en: 'Frozen display cabinet 1' },
      department: { el: 'Κατεψυγμένα', en: 'Frozen foods' },
      category_ids: ['cat_frozen'], tolerance_c: 3,
      sensor: { model: 'Milesight EM500-PT100', serial: 'TL-24-0117', standard: 'EN 12830 · class 1',
                last_verification: '2026-03-14', next_verification: '2027-03-14' } },

    { id: 'fr2', device_id: '24E124136D000102',
      plan_shape: 'room', plan: { x: 4, y: 20 },
      name: { el: 'Θάλαμος κατάψυξης', en: 'Freezer cold room' },
      department: { el: 'Αποθήκη', en: 'Storage' },
      category_ids: ['cat_frozen'], tolerance_c: 0,
      sensor: { model: 'Milesight EM500-PT100', serial: 'TL-24-0118', standard: 'EN 12830 · class 1',
                last_verification: '2026-03-14', next_verification: '2027-03-14' } },

    /* Holds fresh meat and poultry together, so 4 °C binds rather than 7 °C. */
    { id: 'ch1', device_id: '24E124136D000201',
      plan_shape: 'chiller', plan: { x: 60, y: 8 },
      name: { el: 'Ψυγείο κρεάτων', en: 'Meat chiller' },
      department: { el: 'Κρεοπωλείο', en: 'Butchery' },
      category_ids: ['cat_meat', 'cat_poultry'], tolerance_c: 0,
      sensor: { model: 'Elsys ERS-Eye', serial: 'TL-24-0201', standard: 'EN 13485',
                last_verification: '2026-02-02', next_verification: '2027-02-02' } },

    { id: 'ch2', device_id: '24E124136D000202',
      plan_shape: 'chiller', plan: { x: 79, y: 8 },
      name: { el: 'Ψυγείο πουλερικών', en: 'Poultry chiller' },
      department: { el: 'Κρεοπωλείο', en: 'Butchery' },
      category_ids: ['cat_poultry'], tolerance_c: 0,
      sensor: { model: 'Elsys ERS-Eye', serial: 'TL-24-0202', standard: 'EN 13485',
                last_verification: '2026-02-02', next_verification: '2027-02-02' } },

    { id: 'ch3', device_id: '24E124136D000203',
      plan_shape: 'chiller', plan: { x: 60, y: 52 },
      name: { el: 'Ψυγείο κιμά', en: 'Minced meat chiller' },
      department: { el: 'Κρεοπωλείο', en: 'Butchery' },
      category_ids: ['cat_minced'], tolerance_c: 0,
      sensor: { model: 'Elsys ERS-Eye', serial: 'TL-24-0203', standard: 'EN 13485',
                last_verification: '2025-08-20', next_verification: '2026-08-20' } },

    { id: 'ch4', device_id: '24E124136D000301',
      plan_shape: 'cabinet', plan: { x: 31, y: 56 },
      name: { el: 'Βιτρίνα αλιευμάτων', en: 'Fish display counter' },
      department: { el: 'Ιχθυοπωλείο', en: 'Fishmonger' },
      category_ids: ['cat_fish'], tolerance_c: 0,
      sensor: { model: 'Elsys ERS-Eye', serial: 'TL-24-0301', standard: 'EN 13485',
                last_verification: '2026-02-02', next_verification: '2027-02-02' } },

    /* Manufacturer specifies stricter than the general rule, so this unit
       departs from its category — with the reason on the record. */
    { id: 'ch5', device_id: '24E124136D000401',
      plan_shape: 'chiller', plan: { x: 79, y: 52 },
      name: { el: 'Ψυγείο γαλακτοκομικών', en: 'Dairy chiller' },
      department: { el: 'Γαλακτοκομικά', en: 'Dairy' },
      category_ids: ['cat_dairy'], tolerance_c: 0,
      override: { min_c: 0, max_c: 4,
                  reason: { el: 'Προδιαγραφή παρασκευαστή για νωπά τυριά',
                            en: 'Manufacturer specification for fresh cheese' } },
      sensor: { model: 'Elsys ERS-Eye', serial: 'TL-24-0401', standard: 'EN 13485',
                last_verification: '2026-02-02', next_verification: '2027-02-02' } }
  ];

  /* Readings are generated against each unit's derived limits, so the demo
     stays consistent if a category is edited. */
  categories = demoCategories;
  const resolved = demoUnits.map(resolveLimits);

  const now = Date.now();
  const stepMs = 30 * 60000;
  const points = 30 * 48;            /* 30 days at half-hour resolution */
  const demoReadings = [];

  resolved.forEach(unit => {
    const mid = (unit.min_c + unit.max_c) / 2;
    const amplitude = (unit.max_c - unit.min_c) / 6;

    for (let i = points; i >= 0; i--) {
      const t = now - i * stepMs;

      /* Scenario 1: the minced meat chiller lost contact three hours ago. */
      if (unit.id === 'ch3' && t > now - 3 * 3600000) continue;

      let temp = mid + Math.sin(i / 9) * amplitude + (Math.random() - 0.5) * amplitude * 0.6;

      /* Scenario 2: a short excursion five days ago during a delivery. */
      if (unit.id === 'ch1' && i > 240 && i < 244) temp = unit.max_c + 1.4;

      /* Scenario 3: the frozen display cabinet is drifting upward right now. */
      if (unit.id === 'fr1' && i < 6) temp = unit.max_c + (6 - i) * 0.9;

      demoReadings.push({ unit_id: unit.id, ts: new Date(t).toISOString(), temp_c: Number(temp.toFixed(1)) });
    }
  });

  demoCache = { units: demoUnits, categories: demoCategories, readings: demoReadings };
  return demoCache;
}

/* ============================================================
   START
   ============================================================ */
async function refresh() {
  /* Rebuilding the plan while someone is dragging a cabinet across it would
     yank the tile out from under the pointer. */
  if (arranging) return;

  try {
    await loadData();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('updatedAt').textContent = t('loadFailed', { error: err.message });
  }
}

document.documentElement.lang = lang;
refresh();
if (REFRESH_INTERVAL_S > 0) setInterval(refresh, REFRESH_INTERVAL_S * 1000);
